<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" style="z-index: 999999;">
        <div class="slds-modal__container" style="max-width: 95%; width: 95%;">
            <header class="slds-modal__header">
                 <button class="slds-button slds-button_icon slds-modal__close custom-close-btn" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium slds-hyphenate">DOMESTIC PIPE CONFIGURATION</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium custom-scrollbar" style="max-height: 70vh; overflow-y: auto;">
                
                <!-- PRIMARY PIPES TABLE -->
                <div class="slds-box slds-m-bottom_medium border-blue">
                    <div class="slds-m-bottom_small slds-grid slds-grid_align-spread top-controls">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-input disabled={isReadOnly} 
                                type="number" 
                                label="Number of items:" 
                                value={pipeCount} 
                                min="1" 
                                onchange={handlePipeCountChange} 
                                class="short-input slds-m-right_medium">
                            </lightning-input>
                            <template if:false={isReadOnly}>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-button label="Add Row" icon-name="utility:add" onclick={handleAddRow} variant="neutral" class="slds-m-right_medium"></lightning-button>
                                    <lightning-input type="toggle" label="Show Rate in Doc" checked={showRateInDoc} onchange={handleShowRateToggle} message-toggle-active="Yes" message-toggle-inactive="No" class="slds-m-right_medium"></lightning-input>
                                    <lightning-input type="toggle" label="Out of Eastern Zone (-1 ₹/kg)" checked={globalOutOfEasternZone} onchange={handleGlobalZoneToggle} message-toggle-active="Yes" message-toggle-inactive="No" disabled={isReadOnly}></lightning-input>
                                    <lightning-input type="number" label="Lump Sum Value (₹)" value={lumpSumValue} onchange={handleLumpSumChange} disabled={isReadOnly} step="0.01" style="width: 130px;"></lightning-input>
                                </div>
                            </template>
                        </div>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-button-icon icon-name="utility:preview" alternative-text="Toggle Calculations" onclick={toggleCalculations} title="Show/Hide Calculations"></lightning-button-icon>
                        </div>
                    </div>
                    
                    <div class="table-scroll">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered" style="width:100%; min-width:2400px;">
                            <thead>
                                <tr class="slds-line-height_reset bg-blue">
                                    <th style="width:110px;">STEEL TYPE</th>
                                    <th style="width:110px;">DESIGNATION</th>
                                    <th style="width:140px;">STANDARD</th>
                                    <th style="width:120px;">SHAPE / CLASS</th>
                                    <th style="width:100px;">NB / SHAPE</th>
                                    <th style="width:140px;">OD</th>
                                    <th style="width:130px;">WALL THICKNESS</th>
                                    <th style="width:100px;">REFLECT IN DOC</th>
                                    <th style="width:80px;">CUST OD</th>
                                    <th style="width:80px;">CUST THK</th>
                                    <th style="width:130px;">END FINISH</th>
                                    <th style="width:140px;">GRADE</th>
                                    <th style="width:120px;">GRADE EXTRA RATE</th>
                                    <th style="width:150px;">PAINT</th>
                                    <th style="width:120px;">PAINT EXTRA RATE</th>
                                    <th style="width:150px;">ZINC COATING</th>
                                    <th style="width:130px;">ZINC EXTRA RATE</th>
                                    <th style="width:90px;">LENGTH (M)</th>
                                    <th style="width:180px;">SPECIAL DESCRIPTION</th>
                                    <th style="width:180px;">QTY</th>
                                    <th style="width:90px;">UOM</th>
                                    <th style="width:80px;">DISC%</th>
                                   
                                    <th style="width:100px;">TOLERANCE</th>
                                    <th style="width:140px;">FREIGHT</th>
                                    <th style="width:140px;">FREIGHT COST</th>
                                    <template if:true={showCalculations}>
                                        <th style="width:110px;">KG / MTR</th>
                                    </template>
                                    <th style="width:110px;">TOTAL WT (KG)</th>
                                    <template if:true={showCalculations}>
                                        <th style="width:110px;">RATE (PER KG)</th>
                                        <th style="width:110px;">COST PRICE</th>
                                    </template>
                                    <th style="width:110px;">PRICE (PER UOM)</th>
                                    <th style="width:110px;">CUTTOFF PRICE</th>
                                    <th style="width:110px;">QUOTED PRICE</th>
                                    <th style="width:100px;">{gstColumnHeader}</th>
                                    <th style="width:140px;">FINAL OFFER PRICE</th>
                                    <th style="width:120px;">TOTAL PRICE</th>
                                    <th style="width:50px;">DEL</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={pipes} for:item="pipe" for:index="index">
                                    <tr key={pipe.key}>
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="steelType" value={pipe.steelType} options={pipe.steelTypeOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="designation" value={pipe.designation} options={pipe.designationOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="standardSpecGrade" value={pipe.standardSpecGrade} options={pipe.standardOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <td>
                                            <template if:false={isReadOnly}>
                                                <lightning-combobox data-index={index} data-field="shapeType" value={pipe.shapeType} options={pipe.shapeOptions} onchange={handleFieldChange} variant="label-hidden" disabled={pipe.isShapeDisabled}></lightning-combobox>
                                            </template>
                                            <template if:true={isReadOnly}>
                                                <span>{pipe.shapeType}</span>
                                            </template>
                                        </td>
                                        <!-- NB / SHAPE -->
                                        <td>
                                            <template if:true={pipe.isCustomDriven}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                            <template if:true={pipe.isOdDriven}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                            <template if:true={pipe.isShapeDriven}>
                                                <lightning-combobox disabled={isReadOnly} data-index={index} data-field="sizeNb" value={pipe.sizeNb} options={pipe.sizeOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:true={pipe.isNbFirst}>
                                                <lightning-combobox disabled={isReadOnly} data-index={index} data-field="sizeNb" value={pipe.sizeNb} options={pipe.sizeOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:true={pipe.isNbDriven}>
                                                <lightning-input disabled value={pipe.mappedNB} variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                        </td>
                                        <!-- OD -->
                                        <td>
                                            <template if:true={pipe.isCustomDriven}>
                                                <lightning-input disabled={isReadOnly} style="min-width: 100px; width: 100%;" type="number" step="0.1" data-index={index} data-field="sizeNb" value={pipe.sizeNb} onchange={handleFieldChange} variant="label-hidden" placeholder="Manual OD"></lightning-input>
                                            </template>
                                            <template if:true={pipe.isNbDriven}>
                                                <lightning-combobox disabled={isReadOnly} data-index={index} data-field="sizeNb" value={pipe.sizeNb} options={pipe.sizeOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:true={pipe.isNbFirst}>
                                                <lightning-combobox disabled data-index={index} data-field="customOD" value={pipe.mappedOD} options={pipe.odOptions} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:true={pipe.isOdDriven}>
                                                <lightning-combobox disabled={isReadOnly} data-index={index} data-field="sizeNb" value={pipe.sizeNb} options={pipe.sizeOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:true={pipe.isShapeDriven}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                        </td>
                                        <td>
                                            <template if:false={isReadOnly}>
                                                <template if:true={pipe.isCustomDriven}>
                                                    <lightning-input disabled={isReadOnly} style="min-width: 100px; width: 100%;" type="number" step="0.1" data-index={index} data-field="pipeClass" value={pipe.pipeClass} onchange={handleFieldChange} variant="label-hidden" placeholder="Manual WT"></lightning-input>
                                                </template>
                                                <template if:false={pipe.isCustomDriven}>
                                                    <template if:false={pipe.isClassDefault}>
                                                        <lightning-combobox data-index={index} data-field="pipeClass" value={pipe.pipeClass} options={pipe.classOptions} onchange={handleFieldChange} variant="label-hidden" required="true" disabled={pipe.isClassDisabled}></lightning-combobox>
                                                    </template>
                                                    <template if:true={pipe.isClassDefault}>
                                                        <lightning-input type="text" data-index={index} data-field="pipeClass" value={pipe.pipeClass} onchange={handleFieldChange} variant="label-hidden" placeholder="Wall Thickness" required="true"></lightning-input>
                                                    </template>
                                                </template>
                                            </template>
                                            <template if:true={isReadOnly}>
                                                <span>{pipe.pipeClass}</span>
                                            </template>
                                        </td>
                                        <td class="slds-text-align_center">
                                            <lightning-input disabled={isReadOnly} type="toggle" data-index={index} data-field="reflectInOfferDocToggle" checked={pipe.reflectInOfferDocToggle} onchange={handleFieldChange} variant="label-hidden" message-toggle-active="Yes" message-toggle-inactive="No"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="text" data-index={index} data-field="customOD" value={pipe.customOD} onchange={handleFieldChange} variant="label-hidden" placeholder="OD"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input 
                                                disabled={isReadOnly}
                                                type="number" 
                                                step="0.01" 
                                                data-field="customThickness" 
                                                data-index={index} 
                                                value={pipe.customThickness} 
                                                onchange={handleFieldChange}
                                                variant="label-hidden">
                                            </lightning-input>
                                            <template if:true={pipe.showThicknessWarning}>
                                                <div class="slds-text-color_error" style="font-size: 0.65rem; line-height: 1; padding-top: 2px;">
                                                    {pipe.thicknessWarningMessage}
                                                </div>
                                            </template>
                                        </td>
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="endFinish" value={pipe.endFinish} options={pipe.endFinishOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <!-- GRADE -->
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="gradeType" value={pipe.gradeType} options={pipe.gradeOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <!-- GRADE EXTRA RATE -->
                                        <td>
                                            <lightning-input
                                                disabled={pipe.isGradeRateDisabled}
                                                type="number"
                                                step="0.01"
                                                min="0"
                                                data-index={index}
                                                data-field="gradeRate"
                                                value={pipe.gradeRate}
                                                onchange={handleFieldChange}
                                                variant="label-hidden">
                                            </lightning-input>
                                        </td>
                                        <!-- PAINT: only applicable for MS/CS designation -->
                                        <td>
                                            <template if:true={pipe.isPaintApplicable}>
                                                <lightning-combobox disabled={isReadOnly} data-index={index} data-field="paintType" value={pipe.paintType} options={pipe.paintOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:false={pipe.isPaintApplicable}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                        </td>
                                        <!-- PAINT EXTRA RATE: fixed 0.3 for Varnish/Anti Rust, editable for Any Special -->
                                        <td>
                                            <template if:true={pipe.isPaintApplicable}>
                                                <lightning-input
                                                    disabled={pipe.isPaintRateDisabled}
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    data-index={index}
                                                    data-field="paintRate"
                                                    value={pipe.paintRate}
                                                    onchange={handleFieldChange}
                                                    variant="label-hidden">
                                                </lightning-input>
                                            </template>
                                            <template if:false={pipe.isPaintApplicable}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                        </td>
                                        <!-- ZINC COATING: only applicable for GI designation -->
                                        <td>
                                            <template if:true={pipe.isZincApplicable}>
                                                <lightning-combobox disabled={isReadOnly} data-index={index} data-field="zincCoating" value={pipe.zincCoating} options={pipe.zincOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                            </template>
                                            <template if:false={pipe.isZincApplicable}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                        </td>
                                        <!-- ZINC EXTRA RATE: fixed per GSM tier (0/4/8), editable for Any Special -->
                                        <td>
                                            <template if:true={pipe.isZincApplicable}>
                                                <lightning-input
                                                    disabled={pipe.isZincRateDisabled}
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    data-index={index}
                                                    data-field="zincRate"
                                                    value={pipe.zincRate}
                                                    onchange={handleFieldChange}
                                                    variant="label-hidden">
                                                </lightning-input>
                                            </template>
                                            <template if:false={pipe.isZincApplicable}>
                                                <lightning-input disabled value="N/A" variant="label-hidden" class="short-input"></lightning-input>
                                            </template>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" min="0" data-index={index} data-field="pipeLength" value={pipe.pipeLength} onchange={handleFieldChange} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-textarea disabled={isReadOnly} data-index={index} data-field="specialDescription" value={pipe.specialDescription} onchange={handleFieldChange} variant="label-hidden" placeholder="Notes..."></lightning-textarea>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} style="min-width: 140px;" type="number" step="1" maxlength="15" max="999999999999999" data-index={index} data-field="quantity" value={pipe.quantity} onchange={handleFieldChange} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="uom" value={pipe.uom} options={pipe.uomOptions} onchange={handleFieldChange} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-input disabled type="number" step="0.01" data-index={index} data-field="discount" value={pipe.discount} onchange={handleFieldChange} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        
                                        <td>
                                            <lightning-input disabled type="number" step="0.1" value={pipe.toleranceDisplay} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" data-index={index} data-field="freight" value={pipe.freight} onchange={handleFieldChange} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled type="number" step="0.01" value={pipe.freightCost} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <template if:true={showCalculations}>
                                            <td>
                                                <lightning-input disabled={isReadOnly} type="number" step="0.01" value={pipe.singlePipeWeight} variant="label-hidden" readonly></lightning-input>
                                            </td>
                                        </template>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" value={pipe.totalWeight} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <template if:true={showCalculations}>
                                            <td>
                                                <lightning-input disabled={isReadOnly} type="number" step="0.01" value={pipe.rateRsMtr} variant="label-hidden" readonly></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input disabled type="number" step="0.01" value={pipe.costPrice} variant="label-hidden" readonly></lightning-input>
                                            </td>
                                        </template>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" value={pipe.pricePerUom} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled type="number" step="0.01" value={pipe.cutoffPrice} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" data-index={index} data-field="quotedPrice" value={pipe.quotedPrice} onchange={handleFieldChange} onblur={handleQuotedPriceBlur} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled type="number" step="0.01" value={pipe.gst} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled type="number" step="0.01" value={pipe.finalOfferPrice} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" value={pipe.totalPrice} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <td class="slds-text-align_center">
                                            <template if:false={isReadOnly}>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete Row" title="Delete Row" data-index={index} onclick={handleDeleteRow} variant="border-filled"></lightning-button-icon>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- CORE PIPES TABLE -->
                <div class="slds-box border-blue">
                    <div class="slds-m-bottom_small slds-grid slds-grid_align-spread">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <h3 class="slds-text-heading_small slds-m-right_medium"><strong>CORE PIPES</strong></h3>
                            <template if:false={isReadOnly}>
                                <lightning-button label="Add Item" icon-name="utility:add" onclick={handleAddManualRow} variant="neutral"></lightning-button>
                            </template>
                        </div>
                    </div>
                    
                    <div class="table-scroll">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered" style="width:100%;">
                            <thead>
                                <tr class="slds-line-height_reset bg-blue">
                                    <th style="width:80px; text-align: center;">SL.NO</th>
                                    <th style="width:55%;">PIPE DESCRIPTION</th>
                                    <th style="width:150px;">UOM</th>
                                    <th style="width:150px;">QUANTITY</th>
                                    <th style="width:150px;">RATE</th>
                                    <th style="width:180px;">COST</th>
                                    <th style="width:60px; text-align: center;">DEL</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={manualItems} for:item="item" for:index="index">
                                    <tr key={item.key}>
                                        <td style="text-align: center; vertical-align: middle;">
                                            <strong>{item.slNo}</strong>
                                        </td>
                                        <td>
                                            <lightning-combobox disabled={isReadOnly} data-index={index} data-field="description" value={item.description} options={corePipeOptions} onchange={handleManualFieldChange} variant="label-hidden" placeholder="Select Description..."></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-combobox disabled="true" data-index={index} data-field="uom" value={item.uom} options={uomOptions} variant="label-hidden"></lightning-combobox>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" data-index={index} data-field="quantity" value={item.quantity} onchange={handleManualFieldChange} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled={isReadOnly} type="number" step="0.01" data-index={index} data-field="rate" value={item.rate} min={item.minRate} onchange={handleManualFieldChange} onblur={handleManualRateBlur} variant="label-hidden"></lightning-input>
                                        </td>
                                        <td>
                                            <lightning-input disabled type="number" step="0.01" value={item.cost} variant="label-hidden" readonly></lightning-input>
                                        </td>
                                        <td style="text-align: center; vertical-align: middle;">
                                            <template if:false={isReadOnly}>
                                                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete Row" title="Delete Row" data-index={index} onclick={handleDeleteManualRow} variant="border-filled"></lightning-button-icon>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleClose} class="slds-m-right_x-small"></lightning-button>
                <template if:false={isReadOnly}>
                    <lightning-button label="Apply" variant="brand" onclick={handleApply}></lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" style="z-index: 999998;"></div>
</template>
